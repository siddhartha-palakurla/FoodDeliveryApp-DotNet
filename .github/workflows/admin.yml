name: Deploy Admin to S3

on:
  push:
    branches:
      - main
    paths:
      - "admin/**"
      - ".github/workflows/admin.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install admin dependencies
        working-directory: food-delivery-app-main/admin
        run: npm install

      - name: Build admin
        working-directory: food-delivery-app-main/admin
        run: npm run build
        env:
          VITE_API_URL: http://${{ secrets.EC2_HOST }}:5000

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload admin to S3
        run: aws s3 sync food-delivery-app-main/admin/dist s3://${{ secrets.ADMIN_BUCKET }} --delete